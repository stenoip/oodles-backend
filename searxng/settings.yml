# see https://searxng.org
use_default_settings: true

general:
  debug: false # Set to false for cleaner production logs on Render

search:
  formats:
    - html
    - json
    - csv
  api:
    json: true # Unlocks the JSON format so it won't throw an API error
  
  # LOWERED SUSPENSION SETTINGS
  # Keeps engines from getting permanently locked out on Render
  suspension_time: 600       # Checks if an engine works again after 10 minutes
  max_suspension_time: 1800  # Maximum block time limit of 30 minutes

server:
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false 
  image_proxy: true

ui:
  static_use_hash: true

# FIXED SEARCH ENGINES FOR RENDER
engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false

  # Uses a lightweight layout that rarely triggers rate-limit blocks
  - name: duckduckgo
    engine: duckduckgo_lite
    shortcut: ddg
    disabled: false

  # Replaces Brave directly by using Brave's index through a stable gateway
  - name: resulthunter
    engine: resulthunter
    shortcut: rh
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yd
    disabled: false

  - name: tusksearch
    engine: tusksearch
    shortcut: ts
    disabled: false

  - name: privacywall
    engine: privacywall
    shortcut: pw
    disabled: false
